services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${DB_NAME:-syranet}
      POSTGRES_USER: ${DB_USER:-syranet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [control]
    restart: unless-stopped

  node:
    build:
      context: .
      target: node
    environment:
      NODE_TOKEN: ${ENTRY_AGENT_TOKEN:?Run scripts/setup.py}
      NODE_ALLOW_PLAINTEXT: 'true'
    ports:
      - '${HYSTERIA_PORT:-443}:${HYSTERIA_PORT:-443}/udp'
    volumes:
      - node_state:/state
      - ${CERTS_DIR:-./certs}:/certs:ro
    networks: [control, node_egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: [CMD, /usr/local/bin/syranet, health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  manager:
    env_file: [.env]
    build:
      context: .
      target: runtime
    environment:
      SYRANET_ROLE: manager
      CONFIG_PATH: /app/config.yaml
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-syranet}
      DB_USER: ${DB_USER:-syranet}
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.py}
      DB_SSLMODE: disable
      USER_BOT_TOKEN: ${USER_BOT_TOKEN:?Run scripts/setup.py}
      ADMIN_BOT_TOKEN: ${ADMIN_BOT_TOKEN:?Run scripts/setup.py}
      ADMIN_IDS: ${ADMIN_IDS:?Run scripts/setup.py}
      ENTRY_AGENT_TOKEN: ${ENTRY_AGENT_TOKEN:?Run scripts/setup.py}
      UPSTREAM_AGENT_TOKEN: ${UPSTREAM_AGENT_TOKEN:-}
      UPSTREAM_TRANSIT_PASSWORD: ${UPSTREAM_TRANSIT_PASSWORD:-}
      BOT_POLLING_TIMEOUT: ${BOT_POLLING_TIMEOUT:-30}
    volumes:
      - ${PLATFORM_CONFIG:-./configs/local.yaml}:/app/config.yaml:ro
      - manager_state:/state
      - ${TRUST_DIR:-./trust}:/certs:ro
    depends_on:
      postgres: {condition: service_healthy}
      node: {condition: service_started}
    networks: [control, manager_egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    healthcheck:
      test: [CMD, /usr/local/bin/syranet, health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
networks:
  control: {internal: true}
  node_egress: {}
  manager_egress: {}
volumes:
  postgres_data: {}
  node_state: {}
  manager_state: {}
